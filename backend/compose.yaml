services:
  mysql:
    image: mysql:8.4
    container_name: danyeogam-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-danyeogam}
      MYSQL_USER: ${MYSQL_USER:-danyeogam}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-danyeogam-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-danyeogam-root-local}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
